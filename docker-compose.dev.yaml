services:
  db:
    image: postgres:17
    container_name: hotel-db
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: hotel-app
    env_file:
      - .env
    volumes:
      # Bind mount
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      - db
    command: >
      sh -c "flask db upgrade &&
           flask run --host=0.0.0.0 --port=5000"
  
volumes:
  postgres_data: