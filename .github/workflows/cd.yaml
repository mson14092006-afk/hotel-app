name: CD - Publish to Amazon ECR

on:
  workflow_run:
    workflows: ["Build and Publish"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: dev-hotel-app
  DOCKERHUB_IMAGE: mson14092006/hotel-app

jobs:
  deploy:
    name: Push Image to ECR
    runs-on: ubuntu-latest

    # Chỉ chạy khi workflow Build and Publish thành công
    if: github.event.workflow_run.conclusion == 'success'

    # Yêu cầu approval trước khi chạy job
    environment:
      name: dev

    steps:
      # Checkout đúng commit đã kích hoạt workflow trước đó
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Xác thực AWS bằng OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Đăng nhập Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Đăng nhập AWS ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Push image từ Docker Hub sang ECR
      - name: Push Docker Hub image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash scripts/push_ecr.sh
